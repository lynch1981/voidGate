# logban config for the site in me.access.log: a static browser game
# (/, *.js, style.css, README.md), no PHP, no .env, partly behind
# Cloudflare. Built from that log (20 Sep - 4 Oct 2026, 34,946 lines);
# see doc/logban.md section 17 for the replay it was checked with.
#
# Before the first run, fetch Cloudflare's ranges (and from cron after):
#   python3 cdn_allow.py cloudflare /etc/logban/cdn-allow.txt
# Without them, 136 Cloudflare edges were banned in the replay, cutting
# off every visitor behind them.
allow_file = /etc/logban/cdn-allow.txt

# Honey: paths this site never serves, which scanners ask for. One
# request bans. Taken from the 404s most addresses sent; none matches a
# path the site serves (the 200s on /.git and http:// were the leak and
# open-proxy probes). Revisit if the site ever gets PHP, an API under
# /mcp, or a CGI.
honey = /\.env
honey = ^/\.git(/|$)
honey = ^/\.aws/
honey = \.php$
honey = ^/docker-compose\.ya?ml$
# open-proxy checks: "GET http://azenv.net/ HTTP/1.1"
honey = ^https?://
# MCP server scanners
honey = ^/(mcp|sse|api/mcp)/?$
# exploit targets: SAP, GeoServer, Cisco ASA, CGI, Boa and GPON routers,
# Hikvision, Spring actuator, Druid, Hudson, web UIs
honey = ^/(developmentserver/metadatauploader|geoserver/|\+CSCOE\+/|cgi-bin/|boaform/|GponForm/|SDK/webLanguage|actuator/|druid/|hudson|webui/|manage/account/login)
honey_ttl = 3600

# Generic 404s (/login, /admin/index.html, /wiki): a person may type
# them, so they only count in bulk. /favicon.ico, /robots.txt and
# /sitemap.xml are missing too and asked by every browser and crawler:
# the ratio keeps those clients safe.
watch scan = status:404
scan.max = 30
scan.ratio = 0.5

# All 1,050 "Googlebot" requests in the log came from five addresses
# with no reverse DNS: fakes, banned. Real crawlers pass this check.
crawler = googlebot.com
crawler = google.com
crawler = search.msn.com
crawler = applebot.apple.com

# The log has no rt=/urt=, so the costly and backend rules have nothing
# to measure. Add the logban log_format (README) to use them.

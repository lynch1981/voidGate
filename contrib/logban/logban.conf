# logban: ban clients that spend their requests on costly URLs.
# key = value; costly, skip, allow, allow_file, crawler and profile may
# repeat.

# Sliding window and how often it is judged, in seconds.
window = 60
step = 10

# A request is costly when its path (no query string) matches a costly
# regex, or its backend time (urt=, else rt=) is at least slow_seconds.
# 0 turns the time test off. Run with --top-paths 20 on a real log to
# see which paths cost the backend most.
costly = ^/search
costly = ^/api/report
costly = \.php$
slow_seconds = 0.5

# rule=ratio: at least min_costly costly requests in the window AND at
# least `ratio` of the client's requests were costly. Browsers also load
# pages and assets, so their ratio stays well under 0.9. "off" turns the
# rule off.
min_costly = 100
ratio = 0.9

# rule=backend: the client used this many backend seconds in one window,
# whatever it requested. 0 is off. Backend seconds / window = backend
# workers the client keeps busy: 30 is half a worker. Choose it from
# --top-clients on normal logs.
max_backend_seconds = 0

# Profiles: other thresholds for some requests, chosen per request by
# user agent (ua:) or path (path:), first declared profile first. Each
# profile counts its requests apart, and may override min_costly, ratio
# and max_backend_seconds; the rest is inherited. A user agent is free to
# forge, so a profile picks thresholds, never an exemption: a bot copying
# the app's user agent still meets api.max_backend_seconds.
# profile api = ua:^MyShop/
# profile api = path:^/api/v1/
# api.ratio = off                 # an app's ratio is ~1.0 by design
# api.max_backend_seconds = 30    # at most half a worker per address

# Paths not judged at all. Prefer a profile: skipped requests can never
# get anyone banned. Give them their own limit_req.
# skip = ^/health$

# Never banned. 127.0.0.0/8 and ::1 are always allowed. List your
# monitoring, office egress, and any load balancer that talks to nginx.
# allow = 192.0.2.0/24
# allow = 2001:db8::/32

# Files of never-banned networks, one CIDR per line, # comments. Re-read
# when replaced (checked every step); a broken update keeps the old list.
# Missing or broken at startup is an error. cdn_allow.py writes these.
# allow_file = /etc/logban/cdn-allow.txt

# Exempt a client whose reverse DNS ends in one of these AND resolves
# back to the same address. The user agent is never trusted.
# crawler = googlebot.com
# crawler = google.com
# crawler = search.msn.com
# crawler = crawl.yahoo.net
# crawler = applebot.apple.com

# First ban is ttl seconds; each repeat within offense_memory doubles it,
# up to max_ttl. Keep ttl short: one address may be a whole CGNAT.
ttl = 600
max_ttl = 86400
offense_memory = 86400

# voidGate control socket. The user running logban needs access: root,
# or a member of ctl_socket_group in voidgate.conf.
# socket = /run/voidgate.sock
